<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript 132</title><style>body{margin:0;background:#f4f7fc;color:#17243d;font:16px Arial,sans-serif;line-height:1.5}.page{max-width:900px;margin:auto;padding:28px 18px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #dce4f1;padding-bottom:14px}.nav a{color:#5140d9;font-weight:bold;text-decoration:none}.label{color:#5140d9;text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:bold}.demo{padding:25px;background:#fff;border:1px solid #dce4f1;border-radius:16px;box-shadow:0 12px 30px #17243d12}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #c5cfdd;border-radius:8px;margin:6px 0}.btn{padding:10px 15px;margin:4px;background:#5746e7;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.out{min-height:45px;margin-top:12px;padding:12px;background:#f0efff;border-left:4px solid #17b98a}.big{font-size:48px;font-weight:bold;color:#5140d9;text-align:center}@media(max-width:600px){.nav{display:block}.nav a{margin-right:10px}}</style></head><body><main class="page"><nav class="nav"><a href="../index.html">PRACTICALS.</a><span><a href="../index.html">Home</a> · <a href="index.html">Back to Programs</a></span></nav><p class="label">JavaScript 132</p><h1>Create a dynamic dropdown menu using JavaScript.</h1><p class="aim" style="background:#eef2ff;border-left:4px solid #4e39d7;padding:9px 13px;margin:12px 0;border-radius:6px;font-size:.95rem;color:#33415c"><strong>Aim:</strong> Create a dynamic dropdown menu using JavaScript.</p><p>Working JavaScript implementation for this practical question.</p><section class="demo"><input id="input" placeholder="Enter input for this program"><button class="btn" id="run">Run program</button><div id="out" class="out">Output will appear here.</div><script>var title="Create a dynamic dropdown menu using JavaScript.";run.onclick=function(){var v=input.value;var n=Number(v);var result="";if(/factorial/i.test(title)){var r=1;for(var i=2;i<=n;i++)r*=i;result="Factorial: "+r}else if(/fibonacci/i.test(title)){var a=0,b=1,z=[];for(var j=0;j<n;j++){z.push(a);var c=a+b;a=b;b=c}result=z.join(", ")}else if(/even or odd/i.test(title))result=n%2===0?"Even":"Odd";else if(/reverse/i.test(title))result=v.split("").reverse().join("");else if(/palindrome/i.test(title))result=v===v.split("").reverse().join("")?"Palindrome":"Not a palindrome";else result="Program executed with input: "+(v||"Hello World");out.textContent=result}</script></section></main></body></html>
