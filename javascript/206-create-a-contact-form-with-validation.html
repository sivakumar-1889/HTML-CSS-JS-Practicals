<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript 206</title><style>body{margin:0;background:#f4f7fc;color:#17243d;font:16px Arial,sans-serif;line-height:1.5}.page{max-width:900px;margin:auto;padding:28px 18px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #dce4f1;padding-bottom:14px}.nav a{color:#5140d9;font-weight:bold;text-decoration:none}.label{color:#5140d9;text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:bold}.demo{padding:25px;background:#fff;border:1px solid #dce4f1;border-radius:16px;box-shadow:0 12px 30px #17243d12}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #c5cfdd;border-radius:8px;margin:6px 0}.btn{padding:10px 15px;margin:4px;background:#5746e7;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.out{min-height:45px;margin-top:12px;padding:12px;background:#f0efff;border-left:4px solid #17b98a}.big{font-size:48px;font-weight:bold;color:#5140d9;text-align:center}@media(max-width:600px){.nav{display:block}.nav a{margin-right:10px}}</style></head><body><main class="page"><nav class="nav"><a href="../index.html">PRACTICALS.</a><span><a href="../index.html">Home</a> · <a href="index.html">Back to Programs</a></span></nav><p class="label">JavaScript 206</p><h1>Create a contact form with validation.</h1><p class="aim" style="background:#eef2ff;border-left:4px solid #4e39d7;padding:9px 13px;margin:12px 0;border-radius:6px;font-size:.95rem;color:#33415c"><strong>Aim:</strong> Create a contact form with validation.</p><p>Working JavaScript implementation for this practical question.</p><section class="demo"><form id="form"><input id="name" required pattern="[A-Za-z ]+" placeholder="Name"><input id="email" required type="email" placeholder="Email"><input required type="password" minlength="6" placeholder="Password"><button class="btn">Validate</button></form><div id="out" class="out">Complete the fields and submit.</div><script>form.onsubmit=function(e){e.preventDefault();out.textContent=form.checkValidity()?"Valid form submitted.":"Please correct the fields."}</script></section></main></body></html>
