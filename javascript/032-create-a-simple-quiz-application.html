<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Quiz Application</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fc; color: #17243d; font: 16px/1.5 Arial, sans-serif; }
    main { width: min(700px, calc(100% - 32px)); margin: 36px auto; }
    nav { display: flex; justify-content: space-between; margin-bottom: 22px; }
    a { color: #5140d9; font-weight: bold; text-decoration: none; }
    .quiz { background: white; padding: 28px; border-radius: 16px; box-shadow: 0 12px 30px #17243d18; }
    .choice { display: block; padding: 12px; margin: 10px 0; border: 1px solid #d7dfeb; border-radius: 8px; cursor: pointer; }
    .choice:hover { background: #f0efff; border-color: #5746e7; }
    button { border: 0; border-radius: 8px; background: #5746e7; color: white; padding: 10px 16px; font-weight: bold; cursor: pointer; }
    #result { margin-top: 16px; padding: 12px; border-radius: 8px; background: #ecfff8; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav>
    <section class="quiz">
      <p>JavaScript Program 032</p>
      <h1>Simple Quiz Application</h1><p class="aim" style="background:#eef2ff;border-left:4px solid #4e39d7;padding:9px 13px;margin:12px 0;border-radius:6px;font-size:.95rem;color:#33415c"><strong>Aim:</strong> Create a simple quiz application.</p>
      <p id="question"></p>
      <div id="choices"></div>
      <button id="nextButton">Next Question</button>
      <div id="result">Question 1 of 3</div>
    </section>
  </main>
  <script>
    const quizQuestions = [
      { question: "Which language adds interactivity to a webpage?", choices: ["HTML", "CSS", "JavaScript", "SQL"], answer: "JavaScript" },
      { question: "Which HTML element creates a hyperlink?", choices: ["<p>", "<a>", "<img>", "<table>"], answer: "<a>" },
      { question: "What does CSS stand for?", choices: ["Cascading Style Sheets", "Computer Style System", "Creative Site Style", "Code Style Sheets"], answer: "Cascading Style Sheets" }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = "";
    const questionElement = document.getElementById("question");
    const choicesElement = document.getElementById("choices");
    const resultElement = document.getElementById("result");
    const nextButton = document.getElementById("nextButton");

    function showQuestion() {
      const item = quizQuestions[currentQuestion];
      selectedAnswer = "";
      questionElement.textContent = item.question;
      choicesElement.innerHTML = "";
      item.choices.forEach((choice) => {
        const label = document.createElement("label");
        label.className = "choice";
        label.innerHTML = `<input type="radio" name="answer" value="${choice}"> ${choice}`;
        label.querySelector("input").addEventListener("change", () => selectedAnswer = choice);
        choicesElement.appendChild(label);
      });
      resultElement.textContent = `Question ${currentQuestion + 1} of ${quizQuestions.length}`;
      nextButton.textContent = currentQuestion === quizQuestions.length - 1 ? "Show Score" : "Next Question";
    }

    nextButton.addEventListener("click", () => {
      if (!selectedAnswer) {
        resultElement.textContent = "Please select an answer first.";
        return;
      }
      if (selectedAnswer === quizQuestions[currentQuestion].answer) score++;
      currentQuestion++;
      if (currentQuestion < quizQuestions.length) {
        showQuestion();
      } else {
        questionElement.textContent = "Quiz completed!";
        choicesElement.innerHTML = "";
        resultElement.textContent = `Your score is ${score} out of ${quizQuestions.length}.`;
        nextButton.textContent = "Restart Quiz";
        nextButton.onclick = () => { currentQuestion = 0; score = 0; showQuestion(); };
      }
    });

    showQuestion();
  </script>
</body>
</html>
