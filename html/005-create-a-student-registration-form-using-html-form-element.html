<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML 05: Student Registration Form</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;line-height:1.55}header,footer{background:#173f5f;color:white;padding:15px}nav a{color:white;margin-right:15px}section,article{padding:12px;margin:10px 0;border:1px solid #d5dce5}table{border-collapse:collapse;width:100%}th,td{border:1px solid #333;padding:8px;text-align:center}input,select,textarea{display:block;width:100%;padding:8px;margin:6px 0}button{background:#1769aa;color:white;padding:9px 14px;border:0;border-radius:4px}</style></head><body><h1>HTML 05: Student Registration Form</h1><p class="aim" style="background:#eef2ff;border-left:4px solid #4e39d7;padding:9px 13px;margin:12px 0;border-radius:6px;font-size:.95rem;color:#33415c"><strong>Aim:</strong> Create a student registration form using HTML form elements.</p><form><label>Full Name<input required type="text" name="name"></label><label>Register Number<input required type="text" name="register"></label><label>Email<input required type="email" name="email"></label><label>Gender<select><option>Choose</option><option>Male</option><option>Female</option></select></label><label>Address<textarea rows="3"></textarea></label><button type="submit">Register</button><button type="reset">Clear</button></form><p><a href="../index.html">Home</a> | <a href="index.html">Back to Programs</a></p></body></html>
