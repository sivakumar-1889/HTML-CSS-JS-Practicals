<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML 09: HTML5 Input Types</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;line-height:1.55}header,footer{background:#173f5f;color:white;padding:15px}nav a{color:white;margin-right:15px}section,article{padding:12px;margin:10px 0;border:1px solid #d5dce5}table{border-collapse:collapse;width:100%}th,td{border:1px solid #333;padding:8px;text-align:center}input,select,textarea{display:block;width:100%;padding:8px;margin:6px 0}button{background:#1769aa;color:white;padding:9px 14px;border:0;border-radius:4px}</style></head><body><h1>HTML 09: HTML5 Input Types</h1><p class="aim" style="background:#eef2ff;border-left:4px solid #4e39d7;padding:9px 13px;margin:12px 0;border-radius:6px;font-size:.95rem;color:#33415c"><strong>Aim:</strong> Create a webpage using HTML5 input types such as email, date, number, and password.</p><form><label>Email<input type="email" placeholder="name@example.com"></label><label>Date of Birth<input type="date"></label><label>Age<input type="number" min="16" max="100"></label><label>Password<input type="password" minlength="6"></label><label>Website<input type="url" placeholder="https://example.com"></label><label>Favourite color<input type="color"></label><button>Submit</button></form><p><a href="../index.html">Home</a> | <a href="index.html">Back to Programs</a></p></body></html>
